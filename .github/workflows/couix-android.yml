name: PiliPlus COUIX Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.*'
      - '.github/workflows/couix-android.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
      - name: Apply PiliPlus SDK and dependency patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android
      - name: Generate build metadata
        shell: pwsh
        run: lib/scripts/build.ps1 android
      - name: Build ARM64 release APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --no-pub --dart-define-from-file=pili_release.json
      - name: Verify signature and package identity
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/apksigner" verify "$apk"
          "$build_tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/couix-badging"
          grep -F "package: name='com.piliplus.couix'" "$RUNNER_TEMP/couix-badging"
          grep -F "application-label:'PiliPlus COUIX'" "$RUNNER_TEMP/couix-badging"
          cp "$apk" PiliPlus-COUIX-arm64-v8a.apk
          sha256sum PiliPlus-COUIX-arm64-v8a.apk
      - uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-COUIX-arm64-v8a.apk
          path: PiliPlus-COUIX-arm64-v8a.apk
          archive: false
          if-no-files-found: error
